name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }

      - uses: voidzero-dev/setup-vp@v1.21.2
        with: { cache: true, run-install: true }

      - run: vp check
      - run: vp run build
